name: Deploy site to GitHub Pages

# Deploys the WHOLE repo (not just scrollcraft/builds/dojo-na-ceste) because
# the dojo-na-ceste build links out to root-level pages/files with ../../../
# relative paths (galerie.html, prihaska.html, rozpis-hodin.html, two PDFs
# under files/). Deploying only the subfolder would break those links.
on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload repo as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
